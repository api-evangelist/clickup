description: >-
  ClickUp seat pricing read from https://clickup.com/pricing on 2026-09-17. Four platform tiers (Free
  Forever, Unlimited, Business, Enterprise) plus two AI add-ons priced per user. The API is included on
  every plan — what the plan buys, API-side, is the per-token rate limit and a handful of Enterprise-only
  endpoints (Users and Guests management), not access itself.
