id_conventions:
  format: opaque numeric-or-alphanumeric strings
  note: >-
    ClickUp uses no typed id prefixes (no `task_`/`cus_` style). Ids are positional: team_id is a
    Workspace id in v2, workspace_id in v3, group_id is a user group. Custom task type ids appear as
    custom_item_id on a task and as object_id inside a Custom Field's applied_objects entry.
