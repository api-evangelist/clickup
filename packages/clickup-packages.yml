summary: >-
  ClickUp publishes NO first-party client SDK in any package registry. The docs index at
  developer.clickup.com/llms.txt lists 40 guides and ~180 reference pages and names no SDK; the
  github.com/clickup organization holds 6 public repositories, none of them a client library (the only
  API-related one is clickup-APIv2-demo, an example app the webhooks guide links to). Every ClickUp
  client library on npm, PyPI and RubyGems is community-authored. That is the finding: consumers of the
  ClickUp API write raw HTTP or adopt an unaffiliated wrapper.
