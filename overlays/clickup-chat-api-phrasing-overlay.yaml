      - Can I list only the Channels I follow, or ones with messages since a certain time?
      - Are closed Channels included when I list Workspace Channels?
      instructions:
      - text: List the chat Channels in Workspace {workspace_id}.
        slots:
          workspace_id: path.workspace_id
      - text: Show Channels in Workspace {workspace_id} that have messages since {with_message_since}.
