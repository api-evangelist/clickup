openapi: 3.2.0
info:
  title: Clickup Folders API
  version: '2.0'
  description: 'Operations tagged Folders across 3 of this provider''s published API definitions: clickup-api-v2-reference-openapi.json, clickup-folders-openapi.yml, clickup-api-v2-reference-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.clickup.com/api
  description: ClickUp
  variables: {}
- url: https://api.clickup.com/api/v2
  description: ClickUp API v2 Production Server
tags:
- name: Folders
paths:
  /v2/space/{space_id}/folder:
    parameters: []
    get:
      summary: Get Folders
      tags:
      - Folders
      description: View the Folders in a Space. Subfolders are returned in the same flat list as top-level Folders, each with a `parent_folder` field holding the ID of the Folder it is nested inside of. This endpoint does not nest them; to get a Folder's subfolder tree, use Get Folder with `include_subfolders=true`.
      operationId: GetFolders
      parameters:
      - name: space_id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: number
          contentEncoding: double
          examples:
          - 789
      - name: archived
        in: query
        description: ''
        style: form
        explode: true
        schema:
          type: boolean
          examples:
          - false
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                title: GetFoldersresponse
                required:
                - folders
                type: object
                properties:
                  folders:
                    type: array
                    description: 'The Folders in the Space. Subfolders are included in this flat list alongside top-level Folders, each with a `parent_folder` field identifying the Folder it is nested inside of. This endpoint does not nest them; to get a Folder''s subfolder tree, use [Get Folder](#tag/Folders/operation/GetFolder) with `include_subfolders=true`.

                      '
                    items:
                      title: Folder5
                      required:
                      - id
                      - name
                      - orderindex
                      - override_statuses
                      - hidden
                      - space
                      - task_count
                      - lists
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        orderindex:
                          type: integer
                          contentEncoding: int32
                        override_statuses:
                          type: boolean
                        hidden:
                          type: boolean
                        space:
                          $ref: '#/paths/~1v2~1list~1{list_id}/get/responses/200/content/application~1json/schema/properties/space'
                        task_count:
                          type: string
                        archived:
                          type: boolean
                          description: Whether the Folder is archived.
                        statuses:
                          type: array
                          description: 'Statuses defined on this Folder. Only populated when `override_statuses` is `true`. A Folder that inherits its statuses returns an empty array here; its effective statuses are those of its nearest ancestor Folder that overrides them, or of the Space when no ancestor does. To get the resolved statuses for a Folder, request it with [Get Folder](#tag/Folders/operation/GetFolder).

                            '
                          items:
                            $ref: '#/paths/~1v2~1folder~1{folder_id}/get/responses/200/content/application~1json/schema/properties/statuses/items'
                        lists:
                          type: array
                          items:
                            type: string
                        parent_folder:
                          type: string
                          description: 'ID of the parent Folder if this Folder is a subfolder. Only present when the Folder is nested inside another Folder.

                            '
                      examples:
                      - id: '1057'
                        name: Folder Name
                        orderindex: 5
                        override_statuses: true
                        hidden: false
                        space:
                          id: '789'
                          name: Space Name
                          access: true
                        task_count: '20'
                        statuses:
                        - id: c1057_Xv4bNr9T
                          status: to do
                          orderindex: 0
                          color: '#87909e'
                          type: open
                        lists: []
                examples:
                - folders:
                  - id: '457'
                    name: Updated Folder Name
                    orderindex: 0
                    override_statuses: false
                    hidden: false
                    space:
                      id: '789'
                      name: Space Name
                      access: true
                    task_count: '0'
                    statuses: []
                    lists: []
                  - id: '458'
                    name: Second Folder Name
                    orderindex: 1
                    override_statuses: false
                    hidden: false
                    space:
                      id: '789'
                      name: Space Name
                      access: true
                    task_count: '0'
                    statuses: []
                    lists: []
                    parent_folder: '457'
              example:
                folders:
                - id: '457'
                  name: Updated Folder Name
                  orderindex: 0
                  override_statuses: false
                  hidden: false
                  space:
                    id: '789'
                    name: Space Name
                    access: true
                  task_count: '0'
                  statuses: []
                  lists: []
                - id: '458'
                  name: Second Folder Name
                  orderindex: 1
                  override_statuses: false
                  hidden: false
                  space:
                    id: '789'
                    name: Space Name
                    access: true
                  task_count: '0'
                  statuses: []
                  lists: []
                  parent_folder: '457'
      deprecated: false
      security:
      - Authorization_Token: []
    post:
      summary: Create Folder
      tags:
      - Folders
      description: Add a new Folder to a Space. You can optionally create the Folder as a subfolder within an existing Folder by providing `parent_folder_id` in the request body. Subfolder support must be enabled for the Workspace.
      operationId: CreateFolder
      parameters:
      - name: space_id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: number
          contentEncoding: double
          examples:
          - 789
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              title: CreateFolderrequest
              required:
              - name
              type: object
              properties:
                name:
                  type: string
                parent_folder_id:
                  type: string
                  description: 'ID of an existing Folder to create this Folder inside of as a subfolder. The parent Folder must belong to the same Space specified in the path. Subfolder support must be enabled for the Workspace.

                    '
              examples:
              - name: New Folder Name
              - name: New Subfolder Name
                parent_folder_id: '457'
            example:
              name: New Subfolder Name
              parent_folder_id: '457'
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                title: CreateFolderresponse
                required:
                - id
                - name
                - orderindex
                - override_statuses
                - hidden
                - space
                - task_count
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  orderindex:
                    type: integer
                    contentEncoding: int32
                  override_statuses:
                    type: boolean
                  hidden:
                    type: boolean
                  space:
                    $ref: '#/paths/~1v2~1list~1{list_id}/get/responses/200/content/application~1json/schema/properties/space'
                  task_count:
                    type: string
                  archived:
                    type: boolean
                    description: Whether the Folder is archived.
                  statuses:
                    type: array
                    description: 'Statuses defined on this Folder. A newly created Folder inherits its statuses, so this is an empty array unless the Folder overrides them. Entries do not include the status `id` on this response. To get the resolved statuses for the new Folder, request it with [Get Folder](#tag/Folders/operation/GetFolder).

                      '
                    items:
                      $ref: '#/paths/~1v2~1folder~1{folder_id}/get/responses/200/content/application~1json/schema/properties/statuses/items'
                  parent_folder:
                    type: string
                    description: 'ID of the parent Folder if this Folder is a subfolder. Only present when the Folder was created inside another Folder.

                      '
                examples:
                - id: '457'
                  name: New Folder Name
                  orderindex: 0
                  override_statuses: false
                  hidden: false
                  space:
                    id: '789'
                    name: Space Name
                    access: true
                  task_count: '0'
                  statuses: []
              examples:
                top-level-folder:
                  summary: Create a top-level Folder
                  value:
                    id: '457'
                    name: New Folder Name
                    orderindex: 0
                    override_statuses: false
                    hidden: false
                    space:
                      id: '789'
                      name: Space Name
                      access: true
                    task_count: '0'
                subfolder:
                  summary: Create a subfolder within an existing Folder
                  value:
                    id: '460'
                    name: New Subfolder Name
                    orderindex: 0
                    override_statuses: false
                    hidden: false
                    space:
                      id: '789'
                      name: Space Name
                      access: true
                    task_count: '0'
                    parent_folder: '457'
      deprecated: false
      security:
      - Authorization_Token: []
    servers:
    - url: https://api.clickup.com/api
      description: ClickUp
      variables: {}
  /v2/folder/{folder_id}:
    parameters: []
    get:
      summary: Get Folder
      tags:
      - Folders
      description: 'View the Lists within a Folder. If the Folder is a subfolder, the response includes a `parent_folder` field with the parent Folder ID.


        Use the `include_subfolders` query parameter to include a `folders` array in the response. Each entry is a complete Folder object with the same fields as the Folder you requested, including its own `folders` array, so the response contains the whole subfolder tree down to the Workspace''s subfolder nesting limit. Subfolders the requesting user cannot access are excluded.'
      operationId: GetFolder
      parameters:
      - name: folder_id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: number
          contentEncoding: double
          examples:
          - 457
      - name: include_subfolders
        in: query
        description: 'Set to `true` to include the nested subfolder tree in the response as a `folders` array of complete Folder objects. Subfolder support must be enabled for the Workspace.

          '
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                title: GetFolderresponse
                required:
                - id
                - name
                - orderindex
                - override_statuses
                - hidden
                - space
                - task_count
                - lists
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  orderindex:
                    type: integer
                    contentEncoding: int32
                  override_statuses:
                    type: boolean
                  hidden:
                    type: boolean
                  space:
                    $ref: '#/paths/~1v2~1list~1{list_id}/get/responses/200/content/application~1json/schema/properties/space'
                  task_count:
                    type: string
                  archived:
                    type: boolean
                    description: Whether the Folder is archived.
                  statuses:
                    type: array
                    description: 'The statuses that apply to this Folder. Inherited statuses are resolved, so this is populated whether or not `override_statuses` is `true`: a Folder that does not override its statuses returns the statuses of its nearest ancestor Folder that does, or of the Space when no ancestor does.

                      '
                    items:
                      title: FolderStatus
                      type: object
                      properties:
                        id:
                          type: string
                          description: 'Unique identifier of the status. Not returned on the Create Folder response.

                            '
                        status:
                          type: string
                          description: Name of the status.
                        orderindex:
                          type: integer
                          description: Position of the status within its status group.
                        color:
                          type: string
                          description: Hex color code for the status.
                        type:
                          type: string
                          description: Type of the status (`open`, `custom`, `closed`, or `done`).
                      examples:
                      - id: c457_Kq7mZa2P
                        status: to do
                        orderindex: 0
                        color: '#87909e'
                        type: open
                  permission_level:
                    type: string
                    description: 'The requesting user''s permission level on this Folder (`read`, `comment`, `edit`, or `create`).

                      '
                  lists:
                    type: array
                    items:
                      type: string
                    description: ''
                  parent_folder:
                    type: string
                    description: 'ID of the parent Folder if this Folder is a subfolder. Only present when the Folder is nested inside another Folder.

                      '
                  folders:
                    type: array
                    description: 'The subfolder tree beneath this Folder. Each entry is a complete Folder object with the same fields as this Folder, including its own `folders` array, so the whole tree is returned down to the Workspace''s subfolder nesting limit. Leaf Folders have an empty `folders` array.


                      Only present when the `include_subfolders=true` query parameter is set and subfolder support is enabled for the Workspace. Subfolders the requesting user cannot access are excluded.

                      '
                    items:
                      title: Subfolder
                      description: 'A Folder nested inside another Folder, as returned in the `folders` array of a Folder response. Subfolders carry the same fields as the Folder they are nested in, including their own `folders` array, so the response describes the whole subfolder tree.


                        The `space` object is not repeated on nested entries: a subfolder always belongs to the same Space as the Folder you requested.

                        '
                      required:
                      - id
                      - name
                      - orderindex
                      - override_statuses
                      - hidden
                      - task_count
                      - parent_folder
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        orderindex:
                          type: integer
                          contentEncoding: int32
                        override_statuses:
                          type: boolean
                        hidden:
                          type: boolean
                        task_count:
                          type: string
                        archived:
                          type: boolean
                          description: Whether the Folder is archived.
                        statuses:
                          type: array
                          description: 'The statuses that apply to this subfolder. Inherited statuses are resolved, so this is populated whether or not `override_statuses` is `true`, and matches what a direct [Get Folder](#tag/Folders/operation/GetFolder) request for this subfolder returns.

                            '
                          items:
                            $ref: '#/paths/~1v2~1folder~1{folder_id}/get/responses/200/content/application~1json/schema/properties/statuses/items'
                        lists:
                          type: array
                          description: Lists contained in this Folder.
                          items:
                            type: object
                        parent_folder:
                          type: string
                          description: 'ID of the Folder this Folder is nested inside of.

                            '
                        folders:
                          type: array
                          description: 'Subfolders nested inside this Folder, using this same shape. Empty when the Folder has no subfolders, so the array terminates the tree at every leaf.

                            '
                          items:
                            $ref: '#/paths/~1v2~1folder~1{folder_id}/get/responses/200/content/application~1json/schema/properties/folders/items'
                      examples:
                      - id: '460'
                        name: Child Folder Name
                        orderindex: 0
                        override_statuses: false
                        hidden: false
                        task_count: '0'
                        statuses:
                        - id: p789_87Rq2Yzk
                          status: to do
                          orderindex: 0
                          color: '#87909e'
                          type: open
                        lists: []
                        parent_folder: '457'
                        folders: []
                examples:
                - id: '457'
                  name: Updated Folder Name
                  orderindex: 0
                  override_statuses: false
                  hidden: false
                  space:
                    id: '789'
                    name: Space Name
                    access: true
                  task_count: '0'
                  statuses:
                  - id: p789_87Rq2Yzk
                    status: to do
                    orderindex: 0
                    color: '#87909e'
                    type: open
                  lists: []
              examples:
                subfolder:
                  summary: A Folder nested inside another Folder
                  value:
                    id: '457'
                    name: Updated Folder Name
                    orderindex: 0
                    override_statuses: false
                    hidden: false
                    space:
                      id: '789'
                      name: Space Name
                      access: true
                    task_count: '0'
                    lists: []
                    parent_folder: '456'
                nested-tree:
                  summary: 'With include_subfolders=true, returning the nested subfolder tree. None of these Folders override their statuses, so each one resolves to the statuses of the Space.

                    '
                  value:
                    id: '457'
                    name: Parent Folder Name
                    orderindex: 0
                    override_statuses: false
                    hidden: false
                    space:
                      id: '789'
                      name: Space Name
                      access: true
                    task_count: '0'
                    statuses:
                    - id: p789_87Rq2Yzk
                      status: to do
                      orderindex: 0
                      color: '#87909e'
                      type: open
                    lists: []
                    folders:
                    - id: '460'
                      name: Child Folder Name
                      orderindex: 0
                      override_statuses: false
                      hidden: false
                      task_count: '0'
                      statuses:
                      - id: p789_87Rq2Yzk
                        status: to do
                        orderindex: 0
                        color: '#87909e'
                        type: open
                      lists: []
                      parent_folder: '457'
                      folders:
                      - id: '461'
                        name: Grandchild Folder Name
                        orderindex: 0
                        override_statuses: false
                        hidden: false
                        task_count: '0'
                        statuses:
                        - id: p789_87Rq2Yzk
                          status: to do
                          orderindex: 0
                          color: '#87909e'
                          type: open
                        lists: []
                        parent_folder: '460'
                        folders: []
      deprecated: false
      security:
      - Authorization_Token: []
    put:
      summary: Update Folder
      tags:
      - Folders
      description: 'Rename a Folder. Renaming a subfolder leaves it nested inside its parent Folder, and the response includes the `parent_folder` field.


        This endpoint only renames a Folder. To nest a Folder inside another Folder or move it to another Space, use the Move Folder endpoint; a `parent_folder_id` sent to this endpoint is ignored.'
      operationId: UpdateFolder
      parameters:
      - name: folder_id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: number
          contentEncoding: double
          examples:
          - 457
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              title: UpdateFolderrequest
              required:
              - name
              type: object
              properties:
                name:
                  type: string
              examples:
              - name: Updated Folder Name
            example:
              name: Updated Folder Name
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                title: UpdateFolderresponse
                required:
                - id
                - name
                - orderindex
                - override_statuses
                - hidden
                - space
                - task_count
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  orderindex:
                    type: integer
                    contentEncoding: int32
                  override_statuses:
                    type: boolean
                  hidden:
                    type: boolean
                  space:
                    $ref: '#/paths/~1v2~1list~1{list_id}/get/responses/200/content/application~1json/schema/properties/space'
                  task_count:
                    type: string
                  archived:
                    type: boolean
                    description: Whether the Folder is archived.
                  statuses:
                    type: array
                    description: 'Statuses defined on this Folder. Only populated when `override_statuses` is `true`. A Folder that inherits its statuses returns an empty array here; its effective statuses are those of its nearest ancestor Folder that overrides them, or of the Space when no ancestor does. To get the resolved statuses for the Folder, request it with [Get Folder](#tag/Folders/operation/GetFolder).

                      '
                    items:
                      $ref: '#/paths/~1v2~1folder~1{folder_id}/get/responses/200/content/application~1json/schema/properties/statuses/items'
                  parent_folder:
                    type: string
                    description: 'ID of the parent Folder if this Folder is a subfolder. Only present when the Folder is nested inside another Folder.

                      '
                examples:
                - id: '457'
                  name: Updated Folder Name
                  orderindex: 0
                  override_statuses: false
                  hidden: false
                  space:
                    id: '789'
                    name: Space Name
                    access: true
                  task_count: '0'
                  statuses: []
              example:
                id: '457'
                name: Updated Folder Name
                orderindex: 0
                override_statuses: false
                hidden: false
                space:
                  id: '789'
                  name: Space Name
                  access: true
                task_count: '0'
                parent_folder: '456'
      deprecated: false
      security:
      - Authorization_Token: []
    delete:
      summary: Delete Folder
      tags:
      - Folders
      description: Delete a Folder from your Workspace.
      operationId: DeleteFolder
      parameters:
      - name: folder_id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: number
          contentEncoding: double
          examples:
          - 457
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                examples:
                - {}
                contentMediaType: application/json
              example: {}
      deprecated: false
      security:
      - Authorization_Token: []
    servers:
    - url: https://api.clickup.com/api
      description: ClickUp
      variables: {}
  /v2/folder/{folder_id}/position:
    parameters: []
    put:
      summary: Move Folder
      tags:
      - Folders
      description: 'Move a Folder, either by nesting it inside another Folder as a subfolder or by moving it to another Space as a top-level Folder.


        Provide `parent_folder_id` to nest the Folder inside another Folder, or `space_id` to move it to another Space as a top-level Folder. If both are provided, `parent_folder_id` takes precedence and `space_id` is ignored, so the Folder inherits the Space of its new parent Folder. Use `position` to control placement among siblings in the destination; the Folder is placed at the top when `position` is omitted.


        Nesting a Folder requires subfolder support to be enabled for the Workspace. Lists and tasks in the Folder move with it. To rename a Folder instead, use the Update Folder endpoint.'
      operationId: MoveFolder
      parameters:
      - name: folder_id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: number
          contentEncoding: double
          examples:
          - 457
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              title: MoveFolderrequest
              type: object
              properties:
                parent_folder_id:
                  type: string
                  description: 'ID of the Folder to nest this Folder inside of, making it a subfolder. The destination Folder must be in the same Workspace. Subfolder support must be enabled for the Workspace.

                    '
                space_id:
                  type: string
                  description: 'ID of the Space to move this Folder to as a top-level Folder. Ignored when `parent_folder_id` is also provided, in which case the Folder inherits the Space of its new parent Folder.

                    '
                position:
                  type: integer
                  contentEncoding: int32
                  description: 'Position of the Folder among its siblings in the destination. Defaults to the top of the destination when omitted.

                    '
                custom_type_map:
                  type: object
                  description: 'Map of task type IDs in the Folder to the task type IDs to use after the move, as `{"<source_type_id>": <destination_type_id>}`. Required when moving to a destination where a task type used in the Folder is unavailable.

                    '
                  additionalProperties:
                    type: integer
                    contentEncoding: int32
              examples:
              - parent_folder_id: '457'
              - space_id: '790'
                position: 0
            examples:
              nest-as-subfolder:
                summary: Nest the Folder inside another Folder
                value:
                  parent_folder_id: '457'
              move-to-space:
                summary: Move the Folder to another Space as a top-level Folder
                value:
                  space_id: '790'
                  position: 0
        required: true
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                type: object
                examples:
                - {}
                contentMediaType: application/json
              example: {}
        '400':
          description: 'The move is not allowed. `ECODE` identifies the reason:

            * `CAT_147` - a Folder cannot be its own parent.

            * `CAT_148` - the destination Folder is a subfolder of the Folder being moved, which would create a circular reference.

            * `CAT_137` - the move would exceed the Workspace''s subfolder nesting limit.

            * `CAT_158` - the move would exceed the nesting limit because of archived subfolders.

            * `CAT_159` - a Folder cannot be nested inside a hidden Folder.

            * `CAT_140` - a Sprint Folder already exists in the destination''s parent chain.

            * `CAT_141` - a Sprint Folder cannot be moved into a Folder that contains a Sprint Folder.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  err:
                    type: string
                  ECODE:
                    type: string
              example:
                err: A folder cannot be its own parent
                ECODE: CAT_147
      deprecated: false
      security:
      - Authorization_Token: []
    servers:
    - url: https://api.clickup.com/api
      description: ClickUp
      variables: {}
  /v2/space/{space_id}/folder_template/{template_id}:
    post:
      summary: Create Folder from template
      description: 'Create a new Folder using a Folder template within a Space. This endpoint allows you to create a folder with all its nested assets (lists, tasks, etc.) from a predefined template available in your Workspace. Publicly shared templates must be added to your Workspace before you can use them with the public API.

        You can optionally create the Folder as a subfolder within an existing Folder by providing `parent_folder_id` in the request body. Subfolder support must be enabled for the Workspace.

        This request can be run asynchronously or synchronously via the `return_immediately` parameter.'
      operationId: CreateFolderFromTemplate
      tags:
      - Folders
      parameters:
      - in: path
        name: space_id
        required: true
        schema:
          type: string
