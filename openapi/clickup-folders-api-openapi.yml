                description: The status ID.
              status:
                type: string
                description: The status name.
              orderindex:
                type: integer
                description: The order index.
              color:
                type: string
                description: The hex color code.
              type:
                type: string
                description: The status type.
          description: Available statuses for the Folder.
        lists:
          type: array
