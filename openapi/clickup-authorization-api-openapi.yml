openapi: 3.2.0
info:
  title: Clickup Authorization API
  version: '2.0'
  description: 'Operations tagged Authorization across 3 of this provider''s published API definitions: clickup-api-v2-reference-openapi.json, clickup-oauth-openapi.yml, clickup-api-v2-reference-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.clickup.com/api
  description: ClickUp
  variables: {}
- url: https://api.clickup.com/api/v2
  description: ClickUp API v2 Production Server
tags:
- name: Authorization
paths:
  /v2/oauth/token:
    parameters: []
    post:
      summary: Get Access Token
      tags:
      - Authorization
      description: 'These are the routes for authing the API and going through the OAuth flow.\

        \

        Applications utilizing a personal API token don''t use this endpoint.\

        \

        ***Note:** OAuth tokens are not supported when using the **Try It** feature of our Reference docs. You can''t try this endpoint from your web browser.*'
      operationId: GetAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              title: GetAccessTokenrequest
              required:
              - client_id
              - client_secret
              - code
              type: object
              properties:
                client_id:
                  type: string
                  description: OAuth app client id
                client_secret:
                  type: string
                  description: OAuth app client secret
                code:
                  type: string
                  description: Code given in redirect url
              examples:
              - client_id: your_client_id
                client_secret: your_client_secret
                code: authorization_code
            example:
              client_id: your_client_id
              client_secret: your_client_secret
              code: authorization_code
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/paths/~1v2~1oauth~1token/post/requestBody/content/application~1json/schema'
            example:
              client_id: your_client_id
              client_secret: your_client_secret
              code: authorization_code
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                title: GetAccessTokenresponse
                required:
                - access_token
                type: object
                properties:
                  access_token:
                    type: string
                examples:
                - access_token: access token
              example:
                access_token: access token
      deprecated: false
      security: []
      x-hideTryItPanel: true
    servers:
    - url: https://api.clickup.com/api
      description: ClickUp
      variables: {}
  /v2/user:
    parameters: []
    get:
      summary: Get Authorized User
      tags:
      - Authorization
      description: View the details of the authenticated user's ClickUp account.
      operationId: GetAuthorizedUser
      parameters: []
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                title: GetAuthorizedUserresponse
                type: object
                properties:
                  user:
                    title: User
                    type: object
                    properties:
                      id:
                        type: integer
                        contentEncoding: int32
                      username:
                        type: string
                      email:
                        type: string
                      color:
                        type: string
                      profilePicture:
                        type: string
                      initials:
                        type: string
                      week_start_day:
                        type: integer
                        contentEncoding: int32
                        description: The user's preferred start of the calendar week setting. \ `0` is Sunday. \ `1` is Monday.
                      global_font_support:
                        type: boolean
                      timezeone:
                        type: string
                    examples:
                    - id: 123
                      username: John Doe
                      email: user@company.com
                      color: '#000000'
                      profilePicture: https://clickup.com/avatar.jpg
                      initials: JD
                      week_start_day: 0
                      global_font_support: false
                      timezone: America/Los_Angeles
                examples:
                - user:
                    id: 123
                    username: John Doe
                    email: user@company.com
                    color: '#000000'
                    profilePicture: https://clickup.com/avatar.jpg
                    initials: JD
                    week_start_day: 0
                    global_font_support: false
                    timezone: America/Los_Angeles
              example:
                user:
                  id: 123
                  username: John Doe
                  email: user@company.com
                  color: '#000000'
                  profilePicture: https://clickup.com/avatar.jpg
                  initials: JD
                  week_start_day: 0
                  global_font_support: false
                  timezone: America/Los_Angeles
      deprecated: false
      security:
      - Authorization_Token: []
    servers:
    - url: https://api.clickup.com/api
      description: ClickUp
      variables: {}
  /user:
    get:
      operationId: getAuthorizedUser
      summary: Get authorized user
      description: Retrieves information about the currently authenticated user, including their ID, username, email, and profile picture. This endpoint requires a valid access token.
      tags:
      - Authorization
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successfully retrieved user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AuthorizedUser'
        '401':
          description: Unauthorized - invalid or expired token
    servers:
    - url: https://api.clickup.com/api/v2
      description: ClickUp API v2 Production Server
components:
  schemas:
    AuthorizedUser:
      type: object
      description: The authenticated user's profile information.
      properties:
        id:
          type: integer
          description: The unique identifier of the user.
        username:
          type: string
          description: The username of the user.
        email:
          type: string
          format: email
          description: The email address of the user.
        color:
          type: string
          description: The hex color code associated with the user.
        profilePicture:
          type: string
          format: uri
          nullable: true
          description: URL of the user's profile picture.
        initials:
          type: string
          description: The initials of the user.
        week_start_day:
          type: integer
          description: The day of the week that starts the user's week. 0 is Sunday.
        global_font_support:
          type: boolean
          description: Whether global font support is enabled.
        timezone:
          type: string
          description: The user's timezone.
  securitySchemes:
    Authorization_Token:
      name: Authorization
      type: apiKey
      in: header
      description: 'API token required for authentication. Two types of tokens are supported:

        **Personal API Key** Obtain from ClickUp''s settings page under ''Apps'' and add it to the header as `Authorization: pk_...`

        **OAuth2 Access Token** Generated through the OAuth2 flow and add it to the header as `Authorization: Bearer {access_token}`'
    bearerAuth:
      type: http
      scheme: bearer
      description: ClickUp OAuth access token or personal API token. Include in the Authorization header as Bearer {token}.
externalDocs:
  description: ClickUp OAuth Documentation
  url: https://developer.clickup.com/docs/authentication
x-refined-from:
- clickup-api-v2-reference-openapi.json
- clickup-oauth-openapi.yml
- clickup-api-v2-reference-openapi.json
