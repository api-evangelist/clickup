        schema:
          type: boolean
      - name: assignees[]
        in: query
        description: Filter by assignee user IDs.
        schema:
          type: array
          items:
            type: integer
      - name: tags[]
        in: query
        description: Filter by tag names.
        schema:
          type: array
          items:
            type: string
      - name: due_date_gt
        in: query
        description: Filter for tasks with due date after this Unix timestamp in milliseconds.
        schema:
          type: integer
          format: int64
      - name: due_date_lt
        in: query
        description: Filter for tasks with due date before this Unix timestamp in milliseconds.
        schema:
          type: integer
          format: int64
      - name: date_created_gt
        in: query
        description: Filter for tasks created after this Unix timestamp in milliseconds.
        schema:
          type: integer
          format: int64
      - name: date_created_lt
        in: query
        description: Filter for tasks created before this Unix timestamp in milliseconds.
        schema:
          type: integer
          format: int64
      - name: date_updated_gt
        in: query
        description: Filter for tasks updated after this Unix timestamp in milliseconds.
        schema:
          type: integer
          format: int64
      - name: date_updated_lt
        in: query
        description: Filter for tasks updated before this Unix timestamp in milliseconds.
        schema:
          type: integer
          format: int64
      - name: list_ids[]
        in: query
        description: Filter by list IDs.
        schema:
          type: array
          items:
            type: integer
      - name: space_ids[]
        in: query
        description: Filter by space IDs.
        schema:
          type: array
          items:
            type: integer
      - name: project_ids[]
        in: query
        description: Filter by folder (project) IDs.
        schema:
          type: array
          items:
            type: integer
      responses:
        '200':
          description: Successfully retrieved filtered tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
    servers:
    - url: https://api.clickup.com/api/v2
      description: ClickUp API v2 Production Server
  /task/{task_id}/time_in_status:
    get:
      operationId: getTaskTimeInStatus
      summary: Get task time in status
      description: Retrieves how long a task has been in each status. Returns time information for every status the task has been in.
      tags:
      - Tasks
      parameters:
      - $ref: '#/components/parameters/taskId'
      responses:
        '200':
          description: Successfully retrieved time in status data
          content:
            application/json:
              schema:
                type: object
                properties:
                  current_status:
                    type: object
                    description: Current status information with time data.
                  status_history:
                    type: array
                    items:
                      type: object
                    description: Array of status history entries with time data.
        '401':
          description: Unauthorized
        '404':
          description: Task not found
      security:
      - bearerAuth: []
    servers:
    - url: https://api.clickup.com/api/v2
      description: ClickUp API v2 Production Server
  /task/bulk_time_in_status/task_ids:
    get:
      operationId: getBulkTaskTimeInStatus
      summary: Get bulk task time in status
      description: Retrieves time in status data for multiple tasks at once. Accepts an array of task IDs as query parameters.
      tags:
      - Tasks
      parameters:
      - name: task_ids[]
        in: query
        required: true
        description: Array of task IDs to retrieve time in status data for.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Successfully retrieved bulk time in status data
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
    servers:
    - url: https://api.clickup.com/api/v2
      description: ClickUp API v2 Production Server
  /list/{list_id}/task/{task_id}/member:
    get:
      operationId: getTaskMembers
      summary: Get task members
      description: Retrieves the members (assignees and watchers) of a specific task.
