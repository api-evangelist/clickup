  /api/v3/workspaces/{workspace_id}/tasks/{task_id}/time_estimates_by_user:
    patch:
      operationId: updateTimeEstimatesByUser
      summary: Update task time estimates by user
      description: 'Replace the time estimates on a task for specified assignees.


        Assignees must be currently assigned to the task, or use `assignee: unassigned` to set a time estimates for unassigned work.


        You can set up to 10 estimates per request.


        ***Note:** This endpoint is only available on our Business Plan or above.*'
      parameters:
      - name: workspace_id
        in: path
        description: The ID of the Workspace.
        required: true
        schema:
          type: string
      - name: task_id
        in: path
        description: The ID of the task. This parameter supports task IDs and Custom task IDs.
        required: true
        schema:
          type: string
      requestBody:
        description: Array of time estimates per assignee to update (replaces existing, leaves others unchanged)
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPublicApiTaskControllerUpdateTimeEstimatesByUserRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPublicApiTaskControllerUpdateTimeEstimatesByUser200Response'
        '400':
          description: Invalid request parameters, validation error, or not entitled to use time estimates per assignee feature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPublicApiErrorResponse'
        '404':
          description: Task not found or not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPublicApiErrorResponse'
        default:
          description: Generic Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPublicApiErrorResponse'
      tags:
      - Tasks
      x-is-workspace-endpoint: true
      security:
      - authHeader: []
    put:
      operationId: replaceTimeEstimatesByUser
      summary: Replace task time estimates
      description: 'Replaces all time estimates for a task with the provided time estimates. Any existing time estimates not included in the request will be removed.


        Assignees must be currently assigned to the task, or use `assignee: unassigned` to set a time estimates for unassigned work.


        You can set up to 10 estimates per request.


