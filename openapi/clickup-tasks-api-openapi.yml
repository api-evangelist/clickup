  /list/{list_id}/task:
    get:
      operationId: getTasks
      summary: Get tasks in a list
      description: Retrieves all tasks within a specified list. Supports filtering, pagination, and inclusion of subtasks and closed tasks. Results can be ordered by various fields including due date, date created, and date updated.
      tags:
      - Tasks
      parameters:
      - $ref: '#/components/parameters/listId'
      - name: archived
        in: query
        description: Include archived tasks in the response.
        schema:
          type: boolean
          default: false
      - name: include_markdown_description
        in: query
        description: Return task descriptions in Markdown format.
        schema:
          type: boolean
          default: false
      - name: page
        in: query
        description: Page number for pagination. Starts at 0.
        schema:
          type: integer
          minimum: 0
      - name: order_by
        in: query
        description: Field to order results by.
        schema:
          type: string
          enum:
          - id
          - created
          - updated
          - due_date
      - name: reverse
        in: query
        description: Reverse the order of results.
        schema:
          type: boolean
      - name: subtasks
        in: query
        description: Include subtasks in the response.
        schema:
          type: boolean
      - name: statuses[]
        in: query
        description: Filter by task status.
        schema:
          type: array
          items:
            type: string
      - name: include_closed
        in: query
        description: Include closed tasks in the response.
        schema:
          type: boolean
          default: false
      - name: assignees[]
        in: query
        description: Filter by assignee user IDs.
        schema:
          type: array
          items:
            type: integer
      - name: tags[]
        in: query
        description: Filter by tag names.
        schema:
          type: array
          items:
            type: string
      - name: due_date_gt
        in: query
        description: Filter for tasks with due date greater than this Unix timestamp in milliseconds.
        schema:
          type: integer
          format: int64
      - name: due_date_lt
        in: query
        description: Filter for tasks with due date less than this Unix timestamp in milliseconds.
        schema:
          type: integer
          format: int64
      - name: date_created_gt
        in: query
        description: Filter for tasks created after this Unix timestamp in milliseconds.
        schema:
          type: integer
          format: int64
      - name: date_created_lt
        in: query
        description: Filter for tasks created before this Unix timestamp in milliseconds.
        schema:
          type: integer
          format: int64
      - name: date_updated_gt
        in: query
        description: Filter for tasks updated after this Unix timestamp in milliseconds.
        schema:
          type: integer
          format: int64
      - name: date_updated_lt
        in: query
        description: Filter for tasks updated before this Unix timestamp in milliseconds.
        schema:
          type: integer
          format: int64
      - name: custom_fields
        in: query
        description: Filter by custom field values. Provided as a JSON array of objects.
        schema:
          type: string
      responses:
        '200':
          description: Successfully retrieved tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '404':
          description: List not found
      security:
      - bearerAuth: []
    post:
      operationId: createTask
      summary: Create a task
      description: Creates a new task within a specified list. The task can include a name, description, assignees, tags, priority, due date, start date, time estimate, custom fields, and other attributes.
      tags:
      - Tasks
      parameters:
      - $ref: '#/components/parameters/listId'
      - name: custom_task_ids
        in: query
        description: If you want to reference a task by its custom task ID, this value must be true.
        schema:
          type: boolean
      - name: team_id
        in: query
        description: Required when custom_task_ids is set to true. The Workspace ID.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '200':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: List not found
      security:
      - bearerAuth: []
    servers:
    - url: https://api.clickup.com/api/v2
      description: ClickUp API v2 Production Server
  /task/{task_id}:
    get:
      operationId: getTask
      summary: Get a task
      description: Retrieves a single task by its ID, including all task details such as status, assignees, tags, custom fields, and subtasks.
      tags:
      - Tasks
      parameters:
      - $ref: '#/components/parameters/taskId'
      - name: custom_task_ids
        in: query
        description: If you want to reference a task by its custom task ID, this value must be true.
        schema:
          type: boolean
      - name: team_id
        in: query
        description: Required when custom_task_ids is set to true. The Workspace ID.
        schema:
          type: integer
      - name: include_subtasks
        in: query
        description: Include subtasks in the response.
        schema:
          type: boolean
      - name: include_markdown_description
        in: query
        description: Return the task description in Markdown format.
        schema:
          type: boolean
      responses:
        '200':
          description: Successfully retrieved task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '404':
          description: Task not found
      security:
      - bearerAuth: []
    put:
      operationId: updateTask
      summary: Update a task
      description: Updates an existing task. Any fields included in the request body will be updated. Fields not included will remain unchanged.
      tags:
      - Tasks
      parameters:
      - $ref: '#/components/parameters/taskId'
      - name: custom_task_ids
        in: query
        description: If you want to reference a task by its custom task ID, this value must be true.
        schema:
          type: boolean
      - name: team_id
        in: query
        description: Required when custom_task_ids is set to true. The Workspace ID.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Task not found
      security:
      - bearerAuth: []
    delete:
      operationId: deleteTask
      summary: Delete a task
      description: Permanently deletes a task by its ID. This action cannot be undone.
      tags:
      - Tasks
      parameters:
      - $ref: '#/components/parameters/taskId'
      - name: custom_task_ids
        in: query
        description: If you want to reference a task by its custom task ID, this value must be true.
        schema:
          type: boolean
      - name: team_id
        in: query
        description: Required when custom_task_ids is set to true. The Workspace ID.
        schema:
          type: integer
      responses:
        '200':
          description: Task deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Task not found
      security:
      - bearerAuth: []
    servers:
    - url: https://api.clickup.com/api/v2
      description: ClickUp API v2 Production Server
  /team/{team_id}/task:
