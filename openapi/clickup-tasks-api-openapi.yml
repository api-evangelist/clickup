  /v2/team/{team_Id}/task:
    parameters: []
    get:
      summary: Get Filtered Team Tasks
      tags:
      - Tasks
      description: 'View the tasks that meet specific criteria from a Workspace. Responses are limited to 100 tasks per page. \

        \

        You can only view task information of tasks you can access. \

        \

        Each task''s `custom_fields` array only includes Custom Fields applicable to that task''s `custom_item_id`.\

        \

        Our Try It modal currently supports filtering by two or more Lists, Folders, or Spaces. To filter by a single List, Folder, or Space, we recommend using a free app like Postman to test our public API.'
      operationId: GetFilteredTeamTasks
      parameters:
      - name: team_Id
        in: path
        description: Workspace ID
        required: true
        style: simple
        schema:
          type: number
          contentEncoding: double
          examples:
          - 123
      - name: page
        in: query
        description: Page to fetch (starts at 0).
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
      - name: order_by
        in: query
        description: "Order by a particular field. By default, tasks are ordered by `created`.\\\n \\\nOptions include: `id`, `created`, `updated`, and `due_date`."
        style: form
        explode: true
        schema:
          type: string
      - name: reverse
        in: query
        description: Tasks are displayed in reverse order.
        style: form
        explode: true
        schema:
          type: boolean
      - name: subtasks
