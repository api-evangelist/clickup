openapi: 3.2.0
info:
  title: Clickup Tasks API
  version: '1.0'
  description: 'Operations tagged Tasks across 5 of this provider''s published API definitions: clickup-api-v2-reference-openapi.json, clickup-public-api-v3-openapi.json, clickup-tasks-openapi.yml, clickup-api-v2-reference-openapi.json, clickup-public-api-v3-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.clickup.com/api
  description: ClickUp
  variables: {}
- url: https://api.clickup.com/
  description: ClickUp
- url: https://api.clickup.com/api/v2
  description: ClickUp API v2 Production Server
tags:
- name: Tasks
paths:
  /v2/list/{list_id}/task:
    parameters: []
    get:
      summary: Get Tasks
      tags:
      - Tasks
      description: 'View the tasks in a List. Responses are limited to 100 tasks per page. You can only view task information of tasks you can access. \

        \

        This endpoint only includes tasks where the specified `list_id` is their home List. Tasks added to the `list_id` with a different home List are not included in the response by default. To include tasks that exist in multiple lists, use the `include_timl` parameter. \

        \

        The `time_spent` field displays time tracked in milliseconds, and is only included in the response for tasks with time entries.\

        \

        Each task''s `custom_fields` array only includes Custom Fields applicable to that task''s `custom_item_id`.'
      operationId: GetTasks
      parameters:
      - name: list_id
        in: path
        description: 'To find the list_id: \ 1. In the Sidebar, hover over the List and click the **ellipsis ...** menu. \ 2. Select **Copy link.** \ 3. Use the copied URL to find the list_id. The list_id is the number that follows /li in the URL.'
        required: true
        style: simple
        schema:
          type: number
          contentEncoding: double
          examples:
          - 123
      - name: archived
        in: query
        description: ''
        style: form
        explode: true
        schema:
          type: boolean
          examples:
          - false
      - name: include_markdown_description
        in: query
        description: To return task descriptions in Markdown format, use `?include_markdown_description=true`.
        style: form
        explode: true
        schema:
          type: boolean
          examples:
          - true
      - name: page
        in: query
        description: Page to fetch (starts at 0).
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
      - name: order_by
        in: query
        description: "Order by a particular field. By default, tasks are ordered by `created`.\\\n \\\nOptions include: `id`, `created`, `updated`, and `due_date`."
        style: form
        explode: true
        schema:
          type: string
      - name: reverse
        in: query
        description: Tasks are displayed in reverse order.
        style: form
        explode: true
        schema:
          type: boolean
      - name: subtasks
        in: query
        description: Include or exclude subtasks. By default, subtasks are excluded.
        style: form
        explode: true
        schema:
          type: boolean
      - name: statuses
        in: query
        description: "Filter by statuses. To include closed tasks, use the `include_closed` parameter. \\\n \\\nFor example: \\\n \\\n`?statuses[]=to%20do&statuses[]=in%20progress`"
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: include_closed
        in: query
        description: "Include or excluse closed tasks. By default, they are excluded.\\\n \\\nTo include closed tasks, use `include_closed: true`."
        style: form
        explode: true
        schema:
          type: boolean
      - name: include_timl
        in: query
        description: "Include Tasks in Multiple Lists. By default, tasks that exist in multiple lists are excluded from the response.\\\n \\\nTo include tasks that exist in multiple lists, use `include_timl: true`."
        style: form
        explode: true
        schema:
          type: boolean
      - name: assignees
        in: query
        description: "Filter by Assignees. For example: \\\n \\\n`?assignees[]=1234&assignees[]=5678`"
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: watchers
        in: query
        description: Filter by watchers.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: tags
        in: query
        description: "Filter by tags. For example: \\\n \\\n`?tags[]=tag1&tags[]=this%20tag`"
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: due_date_gt
        in: query
        description: Filter by due date greater than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
      - name: due_date_lt
        in: query
        description: Filter by due date less than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
      - name: date_created_gt
        in: query
        description: Filter by date created greater than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
      - name: date_created_lt
        in: query
        description: Filter by date created less than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
      - name: date_updated_gt
        in: query
        description: Filter by date updated greater than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
      - name: date_updated_lt
        in: query
        description: Filter by date updated less than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
      - name: date_done_gt
        in: query
        description: Filter by date done greater than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
      - name: date_done_lt
        in: query
        description: Filter by date done less than Unix time in milliseconds.
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
      - name: custom_fields
        in: query
        description: "Include tasks with specific values in one or more Custom Fields. Custom Relationships are included.\\\n \\\nFor example: `?custom_fields=[{\"field_id\":\"abcdefghi12345678\",\"operator\":\"=\",\"value\":\"1234\"},{\"field_id\":\"jklmnop123456\",\"operator\":\"<\",\"value\":\"5\"}]`\\\n \\\nOnly set Custom Field values display in the `value` property of the `custom_fields` parameter. If you want to include tasks with specific values in only one Custom Field, use `custom_field` instead.\\\n \\\nLearn more about [filtering using Custom Fields.](doc:taskfilters)"
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: custom_field
        in: query
        description: Include tasks with specific values in only one Custom Field. This Custom Field can be a Custom Relationship.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: custom_items
        in: query
        description: "Filter by custom task types. For example: \\\n \\\n`?custom_items[]=0&custom_items[]=1300` \\\n \\\nIncluding `0` returns tasks. Including `1` returns Milestones. Including any other number returns the custom task type as defined in your Workspace."
        style: form
        explode: true
        schema:
          type: array
          items:
            type: number
