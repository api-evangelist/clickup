components:
  schemas:
    TaskPublicApiTaskControllerReplaceTimeEstimatesByUser200Response:
      description: Time estimates successfully replaced
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TaskTimeEstimateResponse'
      required:
      - data
    TaskTimeEstimateItemDto:
      type: object
      properties:
        assignee:
          description: The user ID of the assignee, or `unassigned` for time estimates that are not assigned to anyone.
          example: 300001
          oneOf:
          - type: integer
            description: Add an unassigned time estimate.
          - type: string
            enum:
            - unassigned
            description: The user ID of the task assignee.
        time:
          description: The time estimate in milliseconds. Must be a non-negative integer.
          type: integer
          example: 3600000
          minimum: 0
      required:
      - assignee
      - time
    TaskPublicApiTaskControllerReplaceTimeEstimatesByUserRequest:
      type: array
      items:
        $ref: '#/components/schemas/TaskTimeEstimateItemDto'
    TaskUpsertTimeEstimateResponse:
      type: object
      properties:
        total_time_estimate:
          description: The total time estimate across all assignees after the update, in milliseconds
          type: integer
          example: 14400000
        updated_estimates:
          description: A map of assignee user IDs to their updated time estimates in milliseconds. Only includes assignees whose estimates were modified by this request.
          type: object
          example:
            '300001': 5400000
            '300002': 9000000
          additionalProperties:
            type: integer
      required:
      - total_time_estimate
      - updated_estimates
    TaskPublicApiTaskControllerMoveTask200Response:
      description: Successfully updated the task home list
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TaskMoveTaskResultRto'
      required:
      - data
    TaskPublicApiTaskControllerUpdateTimeEstimatesByUserRequest:
      type: array
      items:
        $ref: '#/components/schemas/TaskTimeEstimateItemDto'
    TaskMoveTaskResultRto:
      type: object
      properties:
        task_id:
          description: The ID of the task.
          type: string
          example: '123'
        new_list_id:
          description: The ID of the newlist.
          type: string
          example: '123'
      required:
      - task_id
      - new_list_id
    TaskPublicApiTaskControllerUpdateTimeEstimatesByUser200Response:
      description: Time estimates successfully updated
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TaskUpsertTimeEstimateResponse'
      required:
      - data
    TaskTimeEstimateResponse:
      type: object
      properties:
        total_time_estimate:
          description: The total time estimate across all assignees in milliseconds
          type: integer
          example: 10800000
        assignee_estimates:
          description: A map of assignee user IDs to their respective time estimates in milliseconds. The key "unassigned" represents time not assigned to any specific user.
          type: object
          example:
            '300001': 3600000
            '300002': 7200000
            unassigned: 0
          additionalProperties:
            type: integer
      required:
      - total_time_estimate
      - assignee_estimates
    TaskSingleStatusMappingDto:
      type: object
      properties:
        source_status_id:
          description: The ID of a status from the task's current List.
          type: string
        destination_status_id:
          description: The ID of the respective status in the new List.
          type: string
      required:
      - source_status_id
      - destination_status_id
    TaskPublicApiTaskControllerMoveTaskWorkspaceIdPath:
      type: integer
    TaskPublicApiErrorResponse:
      type: object
      properties:
        status:
          description: The HTTP Status code for the error
          type: integer
        message:
          description: The message describing the error
          type: string
          example: Generic error message
        trace_id:
          description: Unique trace ID for tracking the request. Used for troubleshooting errors
          type:
          - integer
          - 'null'
          example: 123456789
        timestamp:
          description: The time of the error (Unix epoch milliseconds timestamp).
          type: integer
          example: 1671534256138
      required:
      - status
      - message
      - trace_id
      - timestamp
    TaskMoveTaskBodyParamsDto:
      type: object
      properties:
        move_custom_fields:
          description: Add Custom Fields from the current List to the new List.
          type: boolean
        custom_fields_to_move:
          description: An array of Custom Fields IDs to move. This parameter is not required to move all Custom Fields to the new List.
          type: array
          items:
            type: string
        status_mappings:
          description: "Map the current List statuses to the statuses in the new List. You only need to include the ID of the task's current status and the ID of it's new status.\n \n**Note:** This parameter is required if the task's current status is not available in the new List."
          type: array
          items:
            $ref: '#/components/schemas/TaskSingleStatusMappingDto'
    Priority:
      type: object
      nullable: true
      description: Task priority level.
      properties:
        id:
          type: string
          description: The priority ID.
        priority:
          type: string
          enum:
          - urgent
          - high
          - normal
          - low
          description: The priority level name.
        color:
          type: string
          description: The hex color code of the priority level.
        orderindex:
          type: string
          description: The order index of the priority.
    Status:
      type: object
      description: A task status object.
      properties:
        id:
          type: string
          description: The status ID.
        status:
          type: string
          description: The status name.
        color:
          type: string
          description: The hex color code of the status.
        orderindex:
          type: integer
          description: The order index of the status.
        type:
          type: string
          enum:
          - open
          - custom
          - closed
          - done
          description: The status type.
    Task:
      type: object
      description: A task object representing a unit of work in ClickUp.
      properties:
        id:
          type: string
          description: The unique identifier of the task.
        custom_id:
          type: string
          nullable: true
          description: The custom task ID if enabled for the Workspace.
        name:
          type: string
          description: The name of the task.
        text_content:
          type: string
          nullable: true
          description: The plain text content of the task description.
        description:
          type: string
          nullable: true
          description: The task description in rich text format.
        markdown_description:
          type: string
          nullable: true
          description: The task description in Markdown format.
        status:
          $ref: '#/components/schemas/Status'
        orderindex:
          type: string
          description: The order index of the task within its list.
        date_created:
          type: string
          description: Unix timestamp in milliseconds when the task was created.
        date_updated:
          type: string
          description: Unix timestamp in milliseconds when the task was last updated.
        date_closed:
          type: string
          nullable: true
          description: Unix timestamp in milliseconds when the task was closed.
        date_done:
          type: string
          nullable: true
          description: Unix timestamp in milliseconds when the task was marked done.
        archived:
          type: boolean
          description: Whether the task is archived.
        creator:
          $ref: '#/components/schemas/User'
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: The users assigned to the task.
        watchers:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: The users watching the task.
        checklists:
          type: array
          items:
            type: object
          description: Checklists attached to the task.
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          description: Tags applied to the task.
        parent:
          type: string
          nullable: true
          description: The ID of the parent task if this is a subtask.
        priority:
          $ref: '#/components/schemas/Priority'
        due_date:
          type: string
          nullable: true
          description: Unix timestamp in milliseconds for the due date.
        start_date:
          type: string
          nullable: true
          description: Unix timestamp in milliseconds for the start date.
        points:
          type: number
          nullable: true
          description: Sprint points assigned to the task.
        time_estimate:
          type: integer
          nullable: true
          description: Time estimate in milliseconds.
        time_spent:
          type: integer
          description: Total time tracked on the task in milliseconds.
        custom_fields:
          type: array
          items:
            $ref: '#/components/schemas/CustomField'
          description: Custom field values on the task.
        dependencies:
          type: array
          items:
            type: object
          description: Task dependencies.
        linked_tasks:
          type: array
          items:
            type: object
          description: Tasks linked to this task.
        team_id:
          type: string
          description: The Workspace ID the task belongs to.
        url:
          type: string
          format: uri
          description: The URL to the task in the ClickUp web application.
        list:
          type: object
          properties:
            id:
              type: string
              description: The list ID.
            name:
              type: string
              description: The list name.
            access:
              type: boolean
              description: Whether the user has access to the list.
          description: The list the task belongs to.
        project:
          type: object
          properties:
            id:
              type: string
              description: The folder (project) ID.
            name:
              type: string
              description: The folder name.
            access:
              type: boolean
              description: Whether the user has access to the folder.
          description: The folder (project) the task belongs to.
        folder:
          type: object
          properties:
            id:
              type: string
              description: The folder ID.
            name:
              type: string
              description: The folder name.
            access:
              type: boolean
              description: Whether the user has access to the folder.
          description: The folder the task belongs to.
        space:
          type: object
          properties:
            id:
              type: string
              description: The space ID.
          description: The space the task belongs to.
    UpdateTaskRequest:
      type: object
      description: Request body for updating an existing task. All fields are optional.
      properties:
        name:
          type: string
          description: The updated name of the task.
        description:
          type: string
          description: The updated description in rich text format.
        markdown_description:
          type: string
          description: The updated description in Markdown format.
        assignees:
          type: object
          properties:
            add:
              type: array
              items:
                type: integer
              description: Array of user IDs to add as assignees.
            rem:
              type: array
              items:
                type: integer
              description: Array of user IDs to remove from assignees.
          description: Assignee modifications.
        status:
          type: string
          description: The updated status of the task.
        priority:
          type: integer
          minimum: 1
          maximum: 4
          nullable: true
          description: Updated task priority. 1 is Urgent, 2 is High, 3 is Normal, 4 is Low.
        due_date:
          type: integer
          format: int64
          description: Updated due date as Unix timestamp in milliseconds.
        due_date_time:
          type: boolean
          description: Whether the due date includes a time component.
        time_estimate:
          type: integer
          description: Updated time estimate in milliseconds.
        start_date:
          type: integer
          format: int64
          description: Updated start date as Unix timestamp in milliseconds.
        start_date_time:
          type: boolean
          description: Whether the start date includes a time component.
        parent:
          type: string
          nullable: true
          description: The task ID of the parent task. Set to null to remove parent.
        archived:
          type: boolean
          description: Whether to archive or unarchive the task.
    Tag:
      type: object
      description: A task tag.
      properties:
        name:
          type: string
          description: The name of the tag.
        tag_fg:
          type: string
          description: Foreground color of the tag.
        tag_bg:
          type: string
          description: Background color of the tag.
        creator:
          type: integer
          description: The user ID of the tag creator.
    CreateTaskRequest:
      type: object
      required:
      - name
      description: Request body for creating a new task.
      properties:
        name:
          type: string
          description: The name of the task.
        description:
          type: string
          description: The task description in rich text format.
        markdown_description:
          type: string
          description: The task description in Markdown format.
        assignees:
          type: array
          items:
            type: integer
          description: Array of user IDs to assign to the task.
        tags:
          type: array
          items:
            type: string
          description: Array of tag names to apply to the task.
        status:
          type: string
          description: The status of the task.
        priority:
          type: integer
          minimum: 1
          maximum: 4
          nullable: true
          description: Task priority. 1 is Urgent, 2 is High, 3 is Normal, 4 is Low.
        due_date:
          type: integer
          format: int64
          description: Due date as Unix timestamp in milliseconds.
        due_date_time:
          type: boolean
          description: Whether the due date includes a time component.
        time_estimate:
          type: integer
          description: Time estimate in milliseconds.
        start_date:
          type: integer
          format: int64
          description: Start date as Unix timestamp in milliseconds.
        start_date_time:
          type: boolean
          description: Whether the start date includes a time component.
        notify_all:
