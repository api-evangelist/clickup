components:
  schemas:
    Member:
      type: object
      description: A member with access to a List.
      properties:
        id:
          type: integer
          description: The user ID.
        username:
          type: string
          description: The username.
        email:
          type: string
          format: email
          description: The email address.
        color:
          type: string
          description: The user color.
        profilePicture:
          type: string
          format: uri
          nullable: true
          description: URL of the profile picture.
        initials:
          type: string
          description: The user initials.
    UpdateListRequest:
      type: object
      description: Request body for updating an existing List.
      properties:
        name:
          type: string
          description: The updated name of the List.
        content:
          type: string
          description: The updated content description.
        due_date:
          type: integer
          format: int64
          description: Updated due date as Unix timestamp in milliseconds.
        due_date_time:
          type: boolean
          description: Whether the due date includes a time component.
        priority:
          type: integer
          minimum: 1
          maximum: 4
          description: Updated priority level.
        assignee:
          type: integer
          nullable: true
          description: User ID to assign, or null to unassign.
        unset_status:
          type: boolean
          description: Set to true to clear the List status.
    List:
      type: object
      description: A List object representing a container for tasks within a Space or Folder.
      properties:
        id:
          type: string
          description: The unique identifier of the List.
        name:
          type: string
          description: The name of the List.
        orderindex:
          type: integer
          description: The order index of the List.
        content:
          type: string
          nullable: true
          description: The content description of the List.
        status:
          type: object
          nullable: true
          properties:
            status:
              type: string
              description: The status name.
            color:
              type: string
              description: The hex color code.
            hide_label:
              type: boolean
              description: Whether to hide the status label.
          description: The status of the List.
        priority:
          type: object
          nullable: true
          properties:
            priority:
              type: string
              description: The priority level.
            color:
              type: string
              description: The hex color code.
          description: The priority of the List.
        assignee:
          type: object
          nullable: true
          description: The user assigned to the List.
        task_count:
          type: integer
          nullable: true
          description: The number of tasks in the List.
        due_date:
          type: string
          nullable: true
          description: The due date as a Unix timestamp in milliseconds.
        start_date:
          type: string
          nullable: true
          description: The start date as a Unix timestamp in milliseconds.
        folder:
          type: object
          properties:
            id:
              type: string
              description: The Folder ID.
            name:
              type: string
              description: The Folder name.
            hidden:
              type: boolean
              description: Whether the Folder is hidden.
            access:
              type: boolean
              description: Whether the user has access.
          description: The Folder this List belongs to.
        space:
          type: object
          properties:
            id:
              type: string
              description: The Space ID.
            name:
              type: string
