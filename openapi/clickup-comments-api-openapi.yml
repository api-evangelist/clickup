                    type: string
                  hist_id:
                    type: string
                  date:
                    type: integer
                    contentEncoding: int64
                examples:
                - id: '458'
                  hist_id: '26508'
                  date: 1568036964079
              example:
                id: '458'
                hist_id: '26508'
                date: 1568036964079
