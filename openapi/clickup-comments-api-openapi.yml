openapi: 3.2.0
info:
  title: Clickup Comments API
  version: '1.0'
  description: 'Operations tagged Comments across 3 of this provider''s published API definitions: clickup-api-v2-reference-openapi.json, clickup-comments-openapi.yml, clickup-public-api-v3-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.clickup.com/api
  description: ClickUp
  variables: {}
- url: https://api.clickup.com/api/v2
  description: ClickUp API v2 Production Server
- url: https://api.clickup.com/
  description: ClickUp
tags:
- name: Comments
paths:
  /v2/task/{task_id}/comment:
    parameters: []
    get:
      summary: Get Task Comments
      description: 'View task comments. \

        \

        Retrieve comments from a task. Results are returned in reverse chronological order (newest to oldest). By default, the request returns the 25 most recent comments.\

        \

        Pagination: To fetch the next page of history (older comments), you must use the `start` and `start_id` parameters together, using the data from the last comment of the current response.'
      tags:
      - Comments
      operationId: GetTaskComments
      parameters:
      - name: task_id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: string
          examples:
          - 9hz
      - name: custom_task_ids
        in: query
        description: If you want to reference a task by it's custom task id, this value must be `true`.
        style: form
        explode: true
        schema:
          type: boolean
          examples:
          - true
      - name: team_id
        in: query
        description: "When the `custom_task_ids` parameter is set to `true`, the Workspace ID must be provided using the `team_id` parameter.\n \\\nFor example: `custom_task_ids=true&team_id=123`."
        style: form
        explode: true
        schema:
          type: number
          contentEncoding: double
          examples:
          - 123
      - name: start
        in: query
        description: "The Unix timestamp (in milliseconds) of the reference comment. Required for pagination. Must be used in combination with `start_id`.\n\\\n Value should be the `date` of the last comment from the previous response."
        style: form
        explode: true
        schema:
          type: integer
          contentEncoding: int32
      - name: start_id
        in: query
        description: "The unique ID of the reference comment. Required for pagination. Must be used in combination with `start`. \n\\\n Value should be the `id` of the last comment from the previous response."
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                title: GetTaskCommentsresponse
                required:
                - comments
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      title: Comment
                      required:
                      - id
                      - comment
                      - comment_text
                      - user
                      - resolved
                      - assignee
                      - assigned_by
                      - reactions
                      - date
                      type: object
                      properties:
                        id:
                          type: string
                        comment:
                          type: array
                          items:
                            title: Comment1
                            required:
                            - text
                            type: object
                            properties:
                              text:
                                type: string
                            examples:
                            - text: Task comment content
                          description: ''
                        comment_text:
                          type: string
                        user:
                          $ref: '#/paths/~1v2~1task~1{task_id}/get/responses/200/content/application~1json/schema/properties/attachments/items/properties/user'
                        resolved:
                          type: boolean
                        assignee:
                          title: Assignee
                          required:
                          - id
                          - username
                          - email
                          - color
                          - initials
                          - profilePicture
                          type: object
                          properties:
                            id:
                              type: integer
                              contentEncoding: int32
                            username:
                              type: string
                            email:
                              type: string
                            color:
                              type: string
                            initials:
                              type: string
                            profilePicture:
                              type: string
                          examples:
                          - id: 183
                            username: John Doe
                            email: example@email.com
                            color: '#827718'
                            initials: JD
                            profilePicture: https://attachments.clickup.com/profilePictures/183_nx1.jpg
                        assigned_by:
                          title: AssignedBy
                          required:
                          - id
                          - username
                          - initials
                          - email
                          - color
                          - profilePicture
                          type: object
                          properties:
                            id:
                              type: integer
                              contentEncoding: int32
                            username:
                              type: string
                            initials:
                              type: string
                            email:
                              type: string
                            color:
                              type: string
                            profilePicture:
                              type: string
                          examples:
                          - id: 183
                            username: John Doe
                            initials: JD
                            email: johndoe@gmail.com
                            color: '#827718'
                            profilePicture: https://attachments-public.clickup.com/profilePictures/183_abc.jpg
                        reactions:
                          type: array
                          items:
                            type: string
                          description: ''
                        date:
                          type: string
                        reply_count:
                          type: string
                          description: For threaded comments, `reply_count` is always 0.
                      examples:
                      - id: '458'
                        comment:
                        - text: Task comment content
                        comment_text: Task comment content
                        user:
                          id: 183
                          username: John Doe
                          initials: JD
                          email: johndoe@gmail.com
                          color: '#827718'
                          profilePicture: https://attachments-public.clickup.com/profilePictures/183_abc.jpg
