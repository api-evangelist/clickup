      - Authorization_Token: []
    post:
      summary: Create Task Comment
      tags:
      - Comments
      description: Add a new comment to a task.
      operationId: CreateTaskComment
      parameters:
      - name: task_id
        in: path
        description: ''
        required: true
        style: simple
        schema:
          type: string
          examples:
          - 9hz
      - name: custom_task_ids
        in: query
        description: If you want to reference a task by it's custom task id, this value must be `true`.
        style: form
        explode: true
        schema:
          type: boolean
          examples:
          - true
      - name: team_id
        in: query
        description: "When the `custom_task_ids` parameter is set to `true`, the Workspace ID must be provided using the `team_id` parameter.\n \\\nFor example: `custom_task_ids=true&team_id=123`."
        style: form
        explode: true
        schema:
          type: number
          contentEncoding: double
          examples:
          - 123
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              title: CreateTaskCommentrequest
              required:
              - comment_text
              - notify_all
              type: object
              properties:
                comment_text:
                  type: string
                assignee:
                  type: integer
                  contentEncoding: int32
                group_assignee:
                  type: string
                  contentEncoding: int32
                  description: ''
                notify_all:
                  description: If `notify_all` is true, the creator of the comment will also be notified. Other assignees and watchers on the task are always notified regardless of this setting.
                  type: boolean
              examples:
              - comment_text: Task comment content
                assignee: 183
                group_assignee: d01f92f-48ca-446d-88a1-0beb0e8f5f14
                notify_all: true
            example:
