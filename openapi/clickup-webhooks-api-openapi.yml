openapi: 3.2.0
info:
  title: Clickup Webhooks API
  version: '2.0'
  description: 'Operations tagged Webhooks across 2 of this provider''s published API definitions: clickup-api-v2-reference-openapi.json, clickup-webhooks-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.clickup.com/api
  description: ClickUp
  variables: {}
- url: https://api.clickup.com/api/v2
  description: ClickUp API v2 Production Server
tags:
- name: Webhooks
paths:
  /v2/team/{team_id}/webhook:
    parameters: []
    get:
      summary: Get Webhooks
      tags:
      - Webhooks
      description: View the webhooks created via the API for a Workspace. This endpoint returns webhooks created by the authenticated user.
      operationId: GetWebhooks
      parameters:
      - name: team_id
        in: path
        description: Workspace ID
        required: true
        style: simple
        schema:
          type: number
          contentEncoding: double
          examples:
          - 123
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                title: GetWebhooksresponse
                required:
                - webhooks
                type: object
                properties:
                  webhooks:
                    type: array
                    items:
                      $ref: '#/paths/~1v2~1webhook~1{webhook_id}/put/responses/200/content/application~1json/schema/properties/webhook'
                    description: ''
                examples:
                - webhooks:
                  - id: 4b67ac88-e506-4a29-9d42-26e504e3435e
                    userid: 183
                    team_id: 108
                    endpoint: https://yourdomain.com/webhook
                    client_id: QVOQP06ZXC6CMGVFKB0ZT7J9Y7APOYGO
