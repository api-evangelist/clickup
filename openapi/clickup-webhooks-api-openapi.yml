          application/json:
            schema:
              title: UpdateWebhookrequest
              required:
              - endpoint
              - events
              - status
              type: object
              properties:
                endpoint:
                  type: string
                events:
                  type: string
                status:
                  type: string
              examples:
              - endpoint: https://yourdomain.com/webhook
                events: '*'
                status: active
