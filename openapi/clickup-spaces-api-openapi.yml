          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Space not found
      security:
      - bearerAuth: []
    delete:
      operationId: deleteSpace
