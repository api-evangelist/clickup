        required: false
        schema:
          $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerGetChatChannelMembersLimitQuery'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerGetChatChannelMembers200Response'
