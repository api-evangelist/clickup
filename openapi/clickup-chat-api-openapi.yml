openapi: 3.2.0
info:
  title: ClickUp Public API v3 Chat API
  version: version
  description: This API is exposed to the public internet and is meant to be accessed by third-party integrations.
servers:
- url: https://api.clickup.com/
  description: ClickUp
security:
- authHeader: []
tags:
- description: Chat API
  name: Chat
paths:
  /api/v3/workspaces/{workspace_id}/chat/channels:
    get:
      operationId: getChatChannels
      summary: Retrieve Channels
      description: This endpoint retrieves the Channels in a Workspace.
      parameters:
      - name: workspace_id
        in: path
        description: The ID of the Workspace.
        required: true
        schema:
          $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerGetChatChannelsWorkspaceIdPath'
      - name: description_format
        in: query
        description: 'Format of the Channel description (Default: text/md).'
        required: false
        schema:
          $ref: '#/components/schemas/ChatTextFormat'
      - name: cursor
        in: query
        description: Used to request the next page of results.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: The maximum number of results to fetch for this page.
        required: false
        schema:
          $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerGetChatChannelsLimitQuery'
      - name: is_follower
        in: query
        description: Only return Channels the user is following.
        required: false
        schema:
          $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerGetChatChannelsIsFollowerQuery'
      - name: include_closed
        in: query
        description: Include DMs/Group DMs that have been explicitly closed.
        required: false
        schema:
          $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerGetChatChannelsIncludeClosedQuery'
      - name: with_message_since
        in: query
        description: Only return Channels with at least one message since the given timestamp.
        required: false
        schema:
          $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerGetChatChannelsWithMessageSinceQuery'
      - name: channel_types
        in: query
        description: Specify the types of Channels to return from the request.
        required: false
        schema:
          $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerGetChatChannelsChannelTypesQuery'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerGetChatChannels200Response'
        default:
          description: Generic Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiErrorResponse'
      tags:
      - Chat
      x-is-workspace-endpoint: true
    post:
      operationId: createChatChannel
      summary: Create a Channel
      description: This endpoint creates a new Channel not tied to a Space, Folder, or List. If a Channel with the specified name already exists it returns it.
      parameters:
      - name: workspace_id
        in: path
        description: The ID of the Workspace.
        required: true
        schema:
          $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerCreateChatChannelWorkspaceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCreateChatChannel'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerCreateChatChannel200Response'
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerCreateChatChannel201Response'
        default:
          description: Generic Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiErrorResponse'
      tags:
      - Chat
      x-is-workspace-endpoint: true
  /api/v3/workspaces/{workspace_id}/chat/channels/location:
    post:
      operationId: createLocationChatChannel
      summary: Create a Channel on a Space, Folder, or List
      description: This endpoint creates a Channel on a Space, Folder, or List. When a Channel already exists on the requested location, it returns it.
      parameters:
      - name: workspace_id
        in: path
        description: The ID of the Workspace.
        required: true
        schema:
          $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerCreateLocationChatChannelWorkspaceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCreateLocationChatChannel'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerCreateLocationChatChannel200Response'
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerCreateLocationChatChannel201Response'
        default:
          description: Generic Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiErrorResponse'
      tags:
      - Chat
      x-is-workspace-endpoint: true
  /api/v3/workspaces/{workspace_id}/chat/channels/direct_message:
    post:
      operationId: createDirectMessageChatChannel
      summary: Create a Direct Message
      description: This endpoint creates a new Direct Message between up to 15 users. If a Direct Message between those users already exists it returns it.
      parameters:
      - name: workspace_id
        in: path
        description: The ID of the Workspace.
        required: true
        schema:
          $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerCreateDirectMessageChatChannelWorkspaceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCreateDirectMessageChatChannel'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerCreateDirectMessageChatChannel200Response'
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerCreateDirectMessageChatChannel201Response'
        default:
          description: Generic Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiErrorResponse'
      tags:
      - Chat
      x-is-workspace-endpoint: true
  /api/v3/workspaces/{workspace_id}/chat/channels/{channel_id}:
    get:
      operationId: getChatChannel
      summary: Retrieve a Channel
      description: This endpoint retrieves a specific Channel given its ID.
      parameters:
      - name: workspace_id
        in: path
        description: The ID of the Workspace.
        required: true
        schema:
          $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerGetChatChannelWorkspaceIdPath'
      - name: channel_id
        in: path
        description: The ID of the specified Channel.
        required: true
        schema:
          type: string
      - name: description_format
        in: query
        description: 'Format of the Channel description (Default: text/md).'
        required: false
        schema:
          $ref: '#/components/schemas/ChatTextFormat'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerGetChatChannel200Response'
        '404':
          description: Returns when the requested {channelId} was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiErrorResponse'
        default:
          description: Generic Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiErrorResponse'
      tags:
      - Chat
      x-is-workspace-endpoint: true
    patch:
      operationId: updateChatChannel
      summary: Update a Channel
      description: This endpoint updates a single Channel.
      parameters:
      - name: workspace_id
        in: path
        description: The ID of the Workspace.
        required: true
        schema:
          $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerUpdateChatChannelWorkspaceIdPath'
      - name: channel_id
        in: path
        description: The ID of the specified Channel.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatUpdateChatChannel'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerUpdateChatChannel200Response'
        '400':
          description: Invalid update request for {channelId}.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiErrorResponse'
        '404':
          description: Returns when the requested {channelId} was not found when updating a Channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiErrorResponse'
        default:
          description: Generic Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiErrorResponse'
      tags:
      - Chat
      x-is-workspace-endpoint: true
    delete:
      operationId: deleteChatChannel
      summary: Delete a Channel
      description: This endpoint deletes a Channel. Applies to Channels tied to a Space, Folder, or List or not tied to locations.
      parameters:
      - name: workspace_id
        in: path
        description: The ID of the Workspace.
        required: true
        schema:
          $ref: '#/components/schemas/ChatPublicApiChatChannelsControllerDeleteChatChannelWorkspaceIdPath'
      - name: channel_id
        in: path
        description: The ID of the specified Channel.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: The Channel was deleted.
          content:
            application/json: {}
        '404':
          description: Returns when the requested {channelId} was not found when deleting a Channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiErrorResponse'
        default:
          description: Generic Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatPublicApiErrorResponse'
      tags:
      - Chat
      x-is-workspace-endpoint: true
  /api/v3/workspaces/{workspace_id}/chat/channels/{channel_id}/followers:
    get:
