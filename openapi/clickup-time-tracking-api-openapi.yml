        explode: true
        schema:
          type: number
          contentEncoding: double
          examples:
          - 123
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              title: Createatimeentryrequest
              required:
              - start
              - duration
              type: object
              properties:
                description:
                  type: string
                tags:
                  description: Unlimited uses of time entry tags are available on the Business Plus and Enterprise Plan.
                  type: array
                  items:
                    title: Tags6
                    required:
                    - name
                    - tag_fg
                    - tag_bg
                    type: object
                    properties:
                      name:
                        type: string
                      tag_fg:
                        type: string
                      tag_bg:
                        type: string
                    examples:
                    - name: Tag name
                      tag_fg: '#000000'
                      tag_bg: '#000000'
                start:
                  type: integer
                  contentEncoding: int64
                stop:
                  type: integer
                  contentEncoding: int64
                  description: 'The `duration` parameter can be used instead of the `stop` parameter. '
                end:
                  type: integer
                  contentEncoding: int64
                billable:
                  type: boolean
                duration:
                  description: When there are values for both `start` and `end`, `duration` is ignored. The `stop` parameter can be used instead of the `duration` parameter.
                  type: integer
                  contentEncoding: int32
                assignee:
                  description: Workspace owners and admins can include any user id. Workspace members can only include their own user id. Unlimited uses of creating time entries for other people is available on the Business Plus and Enterprise Plan.
                  type: integer
                  contentEncoding: int32
                tid:
                  description: You can provide a task ID to associate the time entry with a task. Unlimited uses of time entries that are not associated with tasks are available on the Business Plus and Enterprise Plan.
                  type: string
              examples:
              - description: from api
                tags:
                - name: name of tag
                  tag_bg: '#BF55EC'
                  tag_fg: '#FFFFFF'
                start: 1595282645000
                end: 1595282660000
                billable: true
                duration: 50000
                assignee: 1
                tid: task_id
            example:
              description: from api
              tags:
              - name: name of tag
                tag_bg: '#BF55EC'
                tag_fg: '#FFFFFF'
              start: 1595282645000
              billable: true
              duration: 50000
              assignee: 1
              tid: task_id
        required: true
