  /team/{team_id}/time_entries:
    get:
      operationId: getTimeEntries
      summary: Get time entries within a date range
      description: Retrieves time entries within a specified date range for a Workspace. Results can be filtered by assignees and task IDs. Returns time entries with their duration, start time, end time, and associated task information.
      tags:
      - Time Tracking
      parameters:
      - $ref: '#/components/parameters/teamId'
      - name: start_date
        in: query
        description: Unix timestamp in milliseconds for the start of the date range.
        schema:
          type: integer
          format: int64
      - name: end_date
        in: query
        description: Unix timestamp in milliseconds for the end of the date range.
        schema:
          type: integer
          format: int64
      - name: assignee
        in: query
        description: Comma-separated list of user IDs to filter by assignees.
        schema:
          type: string
      - name: include_task_tags
        in: query
        description: Include tags from the associated tasks.
        schema:
          type: boolean
      - name: include_location_names
        in: query
        description: Include names of the spaces, folders, and lists.
        schema:
          type: boolean
      - name: space_id
        in: query
        description: Filter by Space ID.
        schema:
          type: integer
      - name: folder_id
        in: query
        description: Filter by Folder ID.
        schema:
          type: integer
      - name: list_id
        in: query
        description: Filter by List ID.
        schema:
          type: integer
      - name: task_id
        in: query
        description: Filter by Task ID.
        schema:
          type: string
      - name: custom_task_ids
        in: query
        description: If true, the task_id parameter should be a custom task ID.
        schema:
          type: boolean
      responses:
        '200':
          description: Successfully retrieved time entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimeEntry'
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
    post:
      operationId: createTimeEntry
      summary: Create a time entry
      description: Creates a manual time entry for a task in a Workspace. The time entry requires a start timestamp and duration. Optionally, a description, tags, and billable status can be included.
      tags:
      - Time Tracking
      parameters:
      - $ref: '#/components/parameters/teamId'
      - name: custom_task_ids
        in: query
        description: If true, the tid parameter should be a custom task ID.
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeEntryRequest'
      responses:
        '200':
          description: Time entry created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TimeEntry'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
    servers:
    - url: https://api.clickup.com/api/v2
      description: ClickUp API v2 Production Server
