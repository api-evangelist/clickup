                          folder_id:
                            type: integer
                            contentEncoding: int32
                          space_id:
                            type: integer
                            contentEncoding: int32
                          list_name:
                            type: string
                          folder_name:
                            type: string
                          space_name:
                            type: string
                        examples:
                        - list_id: 1560300071
                          folder_id: 468300080
                          space_id: 22800253
                          list_name: List
                          folder_name: Folder
                          space_name: Space
                      task_tags:
                        type: array
                        items:
                          title: TaskTag
                          required:
                          - name
                          - tag_fg
                          - tag_bg
                          - creator
                          type: object
                          properties:
                            name:
                              type: string
                            tag_fg:
                              type: string
                            tag_bg:
                              type: string
                            creator:
                              type: integer
                              contentEncoding: int32
                          examples:
                          - name: content-request
                            tag_fg: '#800000'
                            tag_bg: '#2ecd6f'
                            creator: 301828
                        description: ''
                      task_url:
                        type: string
                    examples:
                    - id: timer_id
                      wid: workspace_id
                      user:
                        id: 1
                        username: first_name last_name
                        email: test@gmail.com
                        color: '#08c7e0'
                        initials: JK
                        profilePicture: https://attachments-public.clickup.com/profilePictures/1_HHk.jpg
                      billable: false
                      start: '1592841559129'
                      end: '1592845899021'
