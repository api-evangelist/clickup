note: >-
  Anonymous tools/list on https://mcp.clickup.com/mcp is OAuth-gated (401), so tools are bound by name
  and documented behaviour, not by a fetched inputSchema. Where a tool maps cleanly onto one operationId
  the confidence is high; where the MCP server composes or filters, it is medium or low and is said so.
  Every operationId below was grepped out of the two specs — none is invented.
