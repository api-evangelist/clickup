  authorization_server: https://mcp.clickup.com
  metadata:
    authorization_server: well-known/clickup-mcp-oauth-authorization-server.json
    protected_resource: well-known/clickup-mcp-oauth-protected-resource.json
  authorization_endpoint: https://mcp.clickup.com/oauth/authorize
  token_endpoint: https://mcp.clickup.com/oauth/token
  registration_endpoint: https://mcp.clickup.com/oauth/register
