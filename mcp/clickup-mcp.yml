deployment:
  mode: remote
  endpoint: https://mcp.clickup.com/mcp
  auth: oauth
  verified: probed
  checked: '2026-09-17'
  probe: gated
  probe_detail: >-
    POST tools/list and POST initialize both returned HTTP 401
    {"error":"invalid_token","error_description":"Bearer token required",
    "resource_metadata":"https://mcp.clickup.com/.well-known/oauth-protected-resource/mcp"}.
    The live tool schemas therefore require an authenticated introspection; the tool list below is the
    provider's PUBLISHED list from https://developer.clickup.com/docs/mcp-tools, names and descriptions
    only, with no inputSchema.
  source: provider documentation naming the endpoint, then a live anonymous probe
